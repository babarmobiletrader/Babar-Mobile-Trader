
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMT Supplier Management</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f2f5fa;font-family:Arial;color:#17243a}
main{max-width:850px;margin:auto}
header{background:#123d70;color:white;padding:20px;border-radius:12px;margin-bottom:16px}
h2{margin:0 0 8px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px #0000000d}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,textarea{width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:7px;font-size:16px}
button{padding:12px 16px;border:0;border-radius:7px;background:#123d70;color:white;font-size:15px;margin:8px 5px 0 0}
.secondary{background:#64748b}
.danger{background:#b42318}
.item{border:1px solid #dce3ed;padding:13px;border-radius:8px;margin:10px 0}
.small{color:#64748b;font-size:13px}
#message{font-weight:bold;margin:10px 0;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<header>
<h2>BMT Supplier Management</h2>
<div>سپلائرز کا ریکارڈ محفوظ کریں اور Edit کریں</div>
</header>

<div class="card">
<h3 id="formTitle">Add New Supplier</h3>
<form id="supplierForm">
<input type="hidden" id="supplierId">

<label>Supplier Name *</label>
<input id="name" required placeholder="Supplier name">

<label>Business Name</label>
<input id="business_name" placeholder="Company / Business name">

<label>Supplier Code</label>
<input id="supplier_code" placeholder="Supplier code">

<label>Phone</label>
<input id="phone" type="tel" placeholder="Phone number">

<label>WhatsApp</label>
<input id="whatsapp" type="tel" placeholder="WhatsApp number">

<label>Email</label>
<input id="email" type="email" placeholder="Email address">

<label>Address</label>
<textarea id="address" rows="2" placeholder="Address"></textarea>

<label>City</label>
<input id="city" placeholder="City">

<label>Opening Balance (PKR)</label>
<input id="opening_balance" type="number" step="0.01" value="0">

<label>Notes</label>
<textarea id="notes" rows="2" placeholder="Additional notes"></textarea>

<button type="submit">Save Supplier</button>
<button type="button" class="secondary" onclick="resetForm()">Clear Form</button>
</form>
<div id="message"></div>
</div>

<div class="card">
<h3>Saved Suppliers</h3>
<div id="supplierList">Loading suppliers...</div>
</div>

<button class="secondary" onclick="location.href='../admin.html'">Back to Admin Dashboard</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script>
const db=window.bmtSupabase;
const $=id=>document.getElementById(id);

function msg(text,color="#123d70"){
 $("message").textContent=text;
 $("message").style.color=color;
}

function resetForm(){
 $("supplierForm").reset();
 $("supplierId").value="";
 $("opening_balance").value="0";
 $("formTitle").textContent="Add New Supplier";
 $("message").textContent="";
}

async function loadSuppliers(){
 if(!db){
  $("supplierList").textContent="Supabase connection not found.";
  return;
 }
 const {data,error}=await db.from("suppliers").select("*").order("created_at",{ascending:false});
 if(error){
  $("supplierList").textContent="Load error: "+error.message;
  return;
 }
 if(!data || !data.length){
  $("supplierList").textContent="No suppliers saved yet.";
  return;
 }
 $("supplierList").innerHTML="";
 data.forEach(s=>{
  const div=document.createElement("div");
  div.className="item";
  const title=document.createElement("strong");
  title.textContent=s.name||"Unnamed Supplier";
  const details=document.createElement("div");
  details.className="small";
  details.textContent=[s.business_name,s.phone,s.city].filter(Boolean).join(" | ");
  const edit=document.createElement("button");
  edit.textContent="Edit";
  edit.onclick=()=>editSupplier(s);
  const del=document.createElement("button");
  del.textContent="Delete";
  del.className="danger";
  del.onclick=()=>deleteSupplier(s.id);
  div.append(title,details,edit,del);
  $("supplierList").append(div);
 });
}

function editSupplier(s){
 $("supplierId").value=s.id||"";
 ["name","business_name","supplier_code","phone","whatsapp","email","address","city","opening_balance","notes"].forEach(k=>{
  $(k).value=s[k]??(k==="opening_balance"?0:"");
 });
 $("formTitle").textContent="Edit Supplier";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteSupplier(id){
 if(!confirm("Are you sure you want to delete this supplier?"))return;
 const {error}=await db.from("suppliers").delete().eq("id",id);
 if(error){msg("Delete error: "+error.message,"#b42318");return;}
 msg("Supplier deleted successfully.");
 await loadSuppliers();
}

$("supplierForm").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!db){msg("Supabase connection not found.","#b42318");return;}

 const id=$("supplierId").value;
 const record={
  name:$("name").value.trim(),
  business_name:$("business_name").value.trim()||null,
  supplier_code:$("supplier_code").value.trim()||null,
  phone:$("phone").value.trim()||null,
  whatsapp:$("whatsapp").value.trim()||null,
  email:$("email").value.trim()||null,
  address:$("address").value.trim()||null,
  city:$("city").value.trim()||null,
  opening_balance:Number($("opening_balance").value||0),
  notes:$("notes").value.trim()||null
 };

 let result;
 if(id){
  result=await db.from("suppliers").update(record).eq("id",id);
 }else{
  result=await db.from("suppliers").insert(record);
 }

 if(result.error){
  msg("Save error: "+result.error.message,"#b42318");
  return;
 }

 msg(id?"Supplier updated successfully.":"Supplier saved successfully.");
 resetForm();
 await loadSuppliers();
});

loadSuppliers();
</script>
</body>
</html>
