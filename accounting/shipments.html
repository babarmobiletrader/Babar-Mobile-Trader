
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMT Shipment Management</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f2f5fa;font-family:Arial;color:#17243a}
main{max-width:850px;margin:auto}
header{background:#123d70;color:white;padding:20px;border-radius:12px;margin-bottom:16px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:16px}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:7px;font-size:16px}
button{padding:12px 16px;border:0;border-radius:7px;background:#123d70;color:white;margin:8px 5px 0 0;font-size:15px}
.secondary{background:#64748b}
.danger{background:#b42318}
.item{border:1px solid #dce3ed;padding:13px;border-radius:8px;margin:10px 0;overflow-wrap:anywhere}
.small{color:#64748b;font-size:13px;line-height:1.8}
#message{font-weight:bold;margin-top:12px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<header>
<h2>BMT Shipment Management</h2>
<div>شپمنٹ اور درآمدی سامان کا ریکارڈ</div>
</header>

<div class="card">
<h3 id="formTitle">Add Shipment</h3>
<form id="shipmentForm">
<input type="hidden" id="recordId">

<label>Shipment Number *</label>
<input id="shipment_number" required>

<label>Supplier</label>
<select id="supplier_id">
<option value="">Select Supplier</option>
</select>

<label>Shipment Date *</label>
<input type="date" id="shipment_date" required>

<label>Origin</label>
<input id="origin" placeholder="e.g. Dubai">

<label>Destination</label>
<input id="destination" placeholder="e.g. Karachi">

<label>Status</label>
<select id="status">
<option value="pending">Pending</option>
<option value="in_transit">In Transit</option>
<option value="received">Received</option>
<option value="partial">Partially Received</option>
</select>

<label>Notes</label>
<textarea id="notes" rows="3"></textarea>

<button type="submit">Save Shipment</button>
<button type="button" class="secondary" onclick="resetForm()">Clear</button>
</form>
<div id="message"></div>
</div>

<div class="card">
<h3>Shipment List</h3>
<div id="shipmentList">Loading...</div>
</div>

<button class="secondary" onclick="location.href='../admin.html'">Back to Dashboard</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script>
const db=window.bmtSupabase;
const $=id=>document.getElementById(id);

function msg(t,color="#123d70"){
 $("message").textContent=t;
 $("message").style.color=color;
}

async function loadSuppliers(){
 const {data,error}=await db.from("suppliers")
 .select("id,name,business_name");

 if(error){
  msg("Supplier load error: "+error.message,"#b42318");
  return;
 }

 $("supplier_id").innerHTML='<option value="">Select Supplier</option>';

 (data||[]).forEach(s=>{
  const op=document.createElement("option");
  op.value=s.id;
  op.textContent=s.name||s.business_name||s.id;
  $("supplier_id").append(op);
 });
}

function resetForm(){
 $("shipmentForm").reset();
 $("recordId").value="";
 $("formTitle").textContent="Add Shipment";
 $("shipment_date").value=new Date().toISOString().slice(0,10);
 $("message").textContent="";
}

async function loadShipments(){
 const {data,error}=await db.from("shipments")
 .select("*").order("created_at",{ascending:false});

 if(error){
  $("shipmentList").textContent="Load error: "+error.message;
  return;
 }

 $("shipmentList").innerHTML="";

 if(!data||!data.length){
  $("shipmentList").textContent="No shipments found.";
  return;
 }

 data.forEach(r=>{
  const box=document.createElement("div");
  box.className="item";

  const title=document.createElement("strong");
  title.textContent=r.shipment_number||"Shipment";

  const detail=document.createElement("div");
  detail.className="small";
  detail.textContent="Date: "+(r.shipment_date||"-")+
   " | Origin: "+(r.origin||"-")+
   " | Destination: "+(r.destination||"-")+
   " | Status: "+(r.status||"-");

  const edit=document.createElement("button");
  edit.textContent="Edit";
  edit.onclick=()=>editShipment(r);

  const del=document.createElement("button");
  del.textContent="Delete";
  del.className="danger";
  del.onclick=()=>deleteShipment(r.id);

  box.append(title,detail,edit,del);
  $("shipmentList").append(box);
 });
}

function editShipment(r){
 $("recordId").value=r.id;

 ["shipment_number","supplier_id","shipment_date",
  "origin","destination","status","notes"].forEach(k=>{
  $(k).value=r[k]??"";
 });

 $("formTitle").textContent="Edit Shipment";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteShipment(id){
 if(!confirm("Delete this shipment?"))return;

 const {error}=await db.from("shipments").delete().eq("id",id);

 if(error){
  msg("Delete error: "+error.message,"#b42318");
  return;
 }

 msg("Shipment deleted.");
 await loadShipments();
}

$("shipmentForm").addEventListener("submit",async e=>{
 e.preventDefault();

 const record={
  shipment_number:$("shipment_number").value.trim(),
  supplier_id:$("supplier_id").value||null,
  shipment_date:$("shipment_date").value,
  origin:$("origin").value.trim()||null,
  destination:$("destination").value.trim()||null,
  status:$("status").value,
  notes:$("notes").value.trim()||null
 };

 const id=$("recordId").value;

 const result=id
 ?await db.from("shipments").update(record).eq("id",id)
 :await db.from("shipments").insert(record);

 if(result.error){
  msg("Save error: "+result.error.message,"#b42318");
  return;
 }

 msg(id?"Shipment updated.":"Shipment saved.");
 resetForm();
 await loadShipments();
});

async function start(){
 if(!db){
  msg("Supabase connection not found.","#b42318");
  return;
 }

 $("shipment_date").value=new Date().toISOString().slice(0,10);
 await loadSuppliers();
 await loadShipments();
}

start();
</script>
</body>
</html>
