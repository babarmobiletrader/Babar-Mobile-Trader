
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMT Supplier Payments</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f2f5fa;font-family:Arial;color:#17243a}
main{max-width:850px;margin:auto}
header{background:#123d70;color:white;padding:20px;border-radius:12px;margin-bottom:16px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:16px}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:7px;font-size:16px}
button{padding:12px 16px;border:0;border-radius:7px;background:#123d70;color:white;margin:8px 5px 0 0;font-size:15px}
.secondary{background:#64748b}
.danger{background:#b42318}
.item{border:1px solid #dce3ed;padding:13px;border-radius:8px;margin:10px 0}
.small{color:#64748b;font-size:13px;margin-top:6px}
#message{font-weight:bold;margin:10px 0;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<header>
<h2>BMT Supplier Payments</h2>
<div>سپلائر کو دی گئی ادائیگیوں کا ریکارڈ</div>
</header>

<div class="card">
<h3 id="formTitle">Add Supplier Payment</h3>
<form id="paymentForm">
<input type="hidden" id="paymentId">

<label>Supplier *</label>
<select id="supplier_id" required>
<option value="">Select Supplier</option>
</select>

<label>Payment Date *</label>
<input type="date" id="payment_date" required>

<label>Payment Amount (PKR) *</label>
<input type="number" id="amount" min="0.01" step="0.01" required>

<label>Payment Method</label>
<select id="payment_method">
<option value="">Select Method</option>
<option value="cash">Cash</option>
<option value="bank">Bank Transfer</option>
<option value="online">Online Transfer</option>
<option value="cheque">Cheque</option>
<option value="other">Other</option>
</select>

<label>Reference Number</label>
<input id="reference_number" placeholder="Transaction / Cheque number">

<label>Notes</label>
<textarea id="notes" rows="3" placeholder="Additional details"></textarea>

<button type="submit">Save Payment</button>
<button type="button" class="secondary" onclick="resetForm()">Clear Form</button>
</form>
<div id="message"></div>
</div>

<div class="card">
<h3>Saved Supplier Payments</h3>
<div id="paymentList">Loading payments...</div>
</div>

<button class="secondary" onclick="location.href='../admin.html'">Back to Admin Dashboard</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script>
const db=window.bmtSupabase;
const $=id=>document.getElementById(id);

function msg(t,color="#123d70"){
 $("message").textContent=t;
 $("message").style.color=color;
}

function resetForm(){
 $("paymentForm").reset();
 $("paymentId").value="";
 $("formTitle").textContent="Add Supplier Payment";
 $("payment_date").value=new Date().toISOString().slice(0,10);
 $("message").textContent="";
}

async function loadSuppliers(){
 const {data,error}=await db.from("suppliers").select("*");
 if(error){
  $("supplier_id").innerHTML='<option value="">Supplier loading error</option>';
  return;
 }
 $("supplier_id").innerHTML='<option value="">Select Supplier</option>';
 (data||[]).forEach(s=>{
  const op=document.createElement("option");
  op.value=s.id;
  op.textContent=s.name||s.business_name||"Supplier";
  $("supplier_id").append(op);
 });
}

async function loadPayments(){
 const {data,error}=await db.from("supplier_payments")
 .select("*").order("created_at",{ascending:false});

 if(error){
  $("paymentList").textContent="Load error: "+error.message;
  return;
 }
 if(!data||!data.length){
  $("paymentList").textContent="No payments saved yet.";
  return;
 }

 $("paymentList").innerHTML="";
 data.forEach(p=>{
  const div=document.createElement("div");
  div.className="item";

  const title=document.createElement("strong");
  title.textContent="PKR "+Number(p.amount||0).toLocaleString();

  const detail=document.createElement("div");
  detail.className="small";
  detail.textContent="Date: "+(p.payment_date||"-")+
   " | Method: "+(p.payment_method||"-");

  const edit=document.createElement("button");
  edit.textContent="Edit";
  edit.onclick=()=>editPayment(p);

  const del=document.createElement("button");
  del.textContent="Delete";
  del.className="danger";
  del.onclick=()=>deletePayment(p.id);

  div.append(title,detail,edit,del);
  $("paymentList").append(div);
 });
}

function editPayment(p){
 $("paymentId").value=p.id||"";
 $("supplier_id").value=p.supplier_id||"";
 $("payment_date").value=p.payment_date||"";
 $("amount").value=p.amount||"";
 $("payment_method").value=p.payment_method||"";
 $("reference_number").value=p.reference_number||"";
 $("notes").value=p.notes||"";
 $("formTitle").textContent="Edit Supplier Payment";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function deletePayment(id){
 if(!confirm("Delete this payment record?"))return;
 const {error}=await db.from("supplier_payments").delete().eq("id",id);
 if(error){msg("Delete error: "+error.message,"#b42318");return;}
 msg("Payment deleted.");
 await loadPayments();
}

$("paymentForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const id=$("paymentId").value;

 const record={
  supplier_id:$("supplier_id").value,
  payment_date:$("payment_date").value,
  amount:Number($("amount").value),
  payment_method:$("payment_method").value||null,
  reference_number:$("reference_number").value.trim()||null,
  notes:$("notes").value.trim()||null
 };

 let result;
 if(id){
  result=await db.from("supplier_payments").update(record).eq("id",id);
 }else{
  result=await db.from("supplier_payments").insert(record);
 }

 if(result.error){
  msg("Save error: "+result.error.message,"#b42318");
  return;
 }

 msg(id?"Payment updated.":"Payment saved.");
 resetForm();
 await loadPayments();
});

async function start(){
 if(!db){msg("Supabase connection not found.","#b42318");return;}
 $("payment_date").value=new Date().toISOString().slice(0,10);
 await loadSuppliers();
 await loadPayments();
}
start();
</script>
</body>
</html>
