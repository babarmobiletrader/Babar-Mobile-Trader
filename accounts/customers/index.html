
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMT Customers</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:Arial;color:#173b70}
header{background:#173b70;color:white;padding:22px;text-align:center}
main{max-width:950px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-weight:bold;font-size:14px}
input{width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:7px}
button{background:#173b70;color:white;padding:12px 20px;border:0;border-radius:7px;margin-top:15px}
table{width:100%;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}
.stat{font-size:21px;font-weight:bold;color:green}
@media(max-width:550px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h2>BABAR MOBILE TRADER</h2>
<p>Customer Management</p>
<a href="../index.html" style="color:white">Back to Dashboard</a>
</header>
<main>
<div class="card">
<h3>Customer Summary</h3>
<p>Total Customers: <span class="stat" id="total">0</span></p>
</div>
<div class="card">
<h3>Add New Customer</h3>
<div class="grid">
<label>Customer Name<input id="name" placeholder="Full name"></label>
<label>Phone Number<input id="phone" placeholder="03XXXXXXXXX"></label>
<label>City<input id="city" placeholder="Karachi"></label>
<label>Opening Balance (Rs.)<input id="balance" type="number" value="0"></label>
</div>
<button onclick="saveCustomer()">Save Customer</button>
</div>
<div class="card">
<h3>Customer Records</h3>
<div style="overflow-x:auto">
<table>
<thead><tr><th>Name</th><th>Phone</th><th>City</th><th>Balance</th></tr></thead>
<tbody id="records"></tbody>
</table>
</div>
</div>
</main>
<script>
let customers=JSON.parse(localStorage.getItem("bmt_customers")||"[]");

function render(){
document.getElementById("total").textContent=customers.length;
let body=document.getElementById("records");
body.replaceChildren();
customers.forEach(c=>{
let tr=document.createElement("tr");
[c.name,c.phone,c.city,"Rs. "+c.balance.toLocaleString()].forEach(value=>{
let td=document.createElement("td");
td.textContent=value;
tr.appendChild(td);
});
body.appendChild(tr);
});
}

function saveCustomer(){
let name=document.getElementById("name").value.trim();
let phone=document.getElementById("phone").value.trim();
let city=document.getElementById("city").value.trim();
let balance=Number(document.getElementById("balance").value);

if(!name||!phone||!Number.isFinite(balance)){
alert("Please enter customer name, phone and valid balance");
return;
}

customers.push({name,phone,city,balance});
localStorage.setItem("bmt_customers",JSON.stringify(customers));

document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("city").value="";
document.getElementById("balance").value="0";
render();
alert("Customer saved successfully");
}
render();
</script>
</body>
</html>
