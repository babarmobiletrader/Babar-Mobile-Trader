
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMT Expenses</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:Arial;color:#173b70}
header{background:#173b70;color:white;padding:22px;text-align:center}
header a{color:white}
main{max-width:950px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-weight:bold;font-size:14px}
input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:7px}
button{background:#173b70;color:white;padding:12px 20px;border:0;border-radius:7px;margin-top:15px;cursor:pointer}
.delete{background:#c62828;padding:7px 10px;margin:0}
.stat{font-size:23px;font-weight:bold;color:#c62828}
table{width:100%;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}
@media(max-width:550px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
<h2>BABAR MOBILE TRADER</h2>
<p>Expense Management</p>
<a href="../index.html">Back to Dashboard</a>
</header>

<main>

<div class="card">
<h3>Total Expenses</h3>
<p class="stat" id="total">Rs. 0</p>
</div>

<div class="card">
<h3>Add New Expense</h3>

<div class="grid">

<label>Date
<input type="date" id="date">
</label>

<label>Expense Category
<select id="category">
<option>Shop Rent</option>
<option>Electricity</option>
<option>Internet</option>
<option>Salary</option>
<option>Transport</option>
<option>Food</option>
<option>Repair & Maintenance</option>
<option>Other</option>
</select>
</label>

<label>Description
<input id="description" placeholder="Expense details">
</label>

<label>Amount (Rs.)
<input type="number" id="amount" min="0" placeholder="Enter amount">
</label>

<label>Payment Method
<select id="payment">
<option>Cash</option>
<option>Bank</option>
<option>JazzCash</option>
<option>EasyPaisa</option>
</select>
</label>

</div>

<button onclick="saveExpense()">Save Expense</button>
</div>

<div class="card">
<h3>Expense Records</h3>
<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>Date</th>
<th>Category</th>
<th>Description</th>
<th>Amount</th>
<th>Payment</th>
<th>Action</th>
</tr>
</thead>
<tbody id="records"></tbody>
</table>
</div>
</div>

</main>

<script>
let expenses = JSON.parse(localStorage.getItem("bmt_expenses") || "[]");

function todayDate(){
let d = new Date();
d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
return d.toISOString().slice(0,10);
}

document.getElementById("date").value = todayDate();

function render(){
let total = expenses.reduce((sum,e)=>sum + e.amount,0);
document.getElementById("total").textContent =
"Rs. " + total.toLocaleString();

let body = document.getElementById("records");
body.replaceChildren();

expenses.forEach((e,index)=>{
let tr = document.createElement("tr");

[e.date,e.category,e.description,
"Rs. "+e.amount.toLocaleString(),e.payment].forEach(value=>{
let td = document.createElement("td");
td.textContent = value;
tr.appendChild(td);
});

let action = document.createElement("td");
let btn = document.createElement("button");
btn.textContent = "Delete";
btn.className = "delete";
btn.onclick = ()=>deleteExpense(index);
action.appendChild(btn);
tr.appendChild(action);

body.appendChild(tr);
});
}

function saveExpense(){
let date = document.getElementById("date").value;
let category = document.getElementById("category").value;
let description = document.getElementById("description").value.trim();
let amount = Number(document.getElementById("amount").value);
let payment = document.getElementById("payment").value;

if(!date || !Number.isFinite(amount) || amount <= 0){
alert("Please enter a valid date and amount.");
return;
}

expenses.push({date,category,description,amount,payment});

localStorage.setItem("bmt_expenses",JSON.stringify(expenses));

document.getElementById("description").value = "";
document.getElementById("amount").value = "";

render();
alert("Expense saved successfully!");
}

function deleteExpense(index){
if(confirm("Are you sure you want to delete this expense?")){
expenses.splice(index,1);
localStorage.setItem("bmt_expenses",JSON.stringify(expenses));
render();
}
}

render();
</script>

</body>
</html>
