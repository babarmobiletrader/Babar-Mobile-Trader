
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMT Purchase</title>
<style>
body{margin:0;background:#f1f5f9;font-family:Arial;color:#173b70}
header{background:#173b70;color:white;padding:22px;text-align:center}
main{max-width:900px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-size:14px;font-weight:bold}
input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:7px;box-sizing:border-box}
button{background:#173b70;color:white;padding:12px 20px;border:0;border-radius:7px;margin-top:15px}
table{width:100%;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}
.total{font-size:20px;font-weight:bold;color:green}
@media(max-width:550px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h2>BABAR MOBILE TRADER</h2>
<p>Purchase Management</p>
</header>
<main>
<div class="card">
<h3>New Purchase Entry</h3>
<div class="grid">
<label>Date<input type="date" id="date"></label>
<label>Supplier<input id="supplier" placeholder="Supplier name"></label>
<label>Mobile Model<input id="model" placeholder="iPhone 13 Pro"></label>
<label>IMEI<input id="imei" placeholder="IMEI number"></label>
<label>Quantity<input type="number" id="qty" value="1" min="1"></label>
<label>Purchase Price<input type="number" id="price" placeholder="Purchase price"></label>
<label>Payment
<select id="payment">
<option>Cash</option>
<option>Bank</option>
<option>Online</option>
<option>Credit</option>
</select>
</label>
</div>
<button onclick="savePurchase()">Save Purchase</button>
</div>
<div class="card">
<h3>Purchase Records</h3>
<p class="total">Total Purchase: Rs. <span id="total">0</span></p>
<div style="overflow-x:auto">
<table>
<thead><tr><th>Date</th><th>Supplier</th><th>Model</th><th>Qty</th><th>Amount</th></tr></thead>
<tbody id="records"></tbody>
</table>
</div>
</div>
</main>
<script>
let purchases=JSON.parse(localStorage.getItem("bmt_purchases")||"[]");
function render(){
let total=0;
document.getElementById("records").innerHTML=purchases.map(p=>{
total+=p.amount;
return `<tr><td>${p.date}</td><td>${p.supplier}</td><td>${p.model}</td><td>${p.qty}</td><td>Rs. ${p.amount.toLocaleString()}</td></tr>`;
}).join("");
document.getElementById("total").textContent=total.toLocaleString();
}
function savePurchase(){
let supplier=document.getElementById("supplier").value.trim();
let model=document.getElementById("model").value.trim();
let qty=Number(document.getElementById("qty").value);
let price=Number(document.getElementById("price").value);
if(!supplier||!model||qty<=0||price<=0){alert("Please complete all fields");return;}
purchases.push({
date:document.getElementById("date").value,
supplier,model,
imei:document.getElementById("imei").value,
qty,amount:qty*price,
payment:document.getElementById("payment").value
});
localStorage.setItem("bmt_purchases",JSON.stringify(purchases));
render();
alert("Purchase saved");
}
document.getElementById("date").value=new Date().toISOString().slice(0,10);
render();
</script>
</body>
</html>
