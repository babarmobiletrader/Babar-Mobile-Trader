
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMT Sales Management</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:Arial;color:#173b70}
header{background:#173b70;color:white;padding:22px;text-align:center}
main{max-width:950px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-size:14px;font-weight:bold}
input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:7px}
button{background:#173b70;color:white;padding:12px 20px;border:0;border-radius:7px;margin-top:15px;cursor:pointer}
table{width:100%;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}
.total{font-size:20px;font-weight:bold;color:green}
a{color:white}
@media(max-width:550px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h2>BABAR MOBILE TRADER</h2>
<p>Sales Management</p>
<a href="../index.html">Back to Dashboard</a>
</header>
<main>
<div class="card">
<h3>New Sale Entry</h3>
<div class="grid">
<label>Date<input type="date" id="date"></label>
<label>Customer Name<input id="customer" placeholder="Customer name"></label>
<label>Mobile Model<input id="model" placeholder="iPhone 13 Pro"></label>
<label>IMEI Number<input id="imei" placeholder="IMEI number"></label>
<label>Quantity<input type="number" id="qty" value="1" min="1"></label>
<label>Sale Price Per Phone<input type="number" id="price" placeholder="Sale price"></label>
<label>Payment Method
<select id="payment">
<option>Cash</option>
<option>Bank</option>
<option>Online</option>
<option>Credit</option>
</select>
</label>
</div>
<button onclick="saveSale()">Save Sale</button>
</div>
<div class="card">
<h3>Sales Records</h3>
<p class="total">Total Sales: Rs. <span id="total">0</span></p>
<div style="overflow-x:auto">
<table>
<thead>
<tr><th>Date</th><th>Customer</th><th>Model</th><th>Qty</th><th>Amount</th></tr>
</thead>
<tbody id="records"></tbody>
</table>
</div>
</div>
</main>
<script>
let sales=JSON.parse(localStorage.getItem("bmt_sales")||"[]");

function render(){
let total=0;
const body=document.getElementById("records");
body.innerHTML="";
sales.forEach(s=>{
total+=s.amount;
let tr=document.createElement("tr");
[s.date,s.customer,s.model,s.qty,"Rs. "+s.amount.toLocaleString()].forEach(v=>{
let td=document.createElement("td");
td.textContent=v;
tr.appendChild(td);
});
body.appendChild(tr);
});
document.getElementById("total").textContent=total.toLocaleString();
}

function saveSale(){
let customer=document.getElementById("customer").value.trim();
let model=document.getElementById("model").value.trim();
let qty=Number(document.getElementById("qty").value);
let price=Number(document.getElementById("price").value);

if(!customer||!model||qty<=0||price<=0){
alert("Please complete all required fields");
return;
}

sales.push({
date:document.getElementById("date").value,
customer:customer,
model:model,
imei:document.getElementById("imei").value,
qty:qty,
amount:qty*price,
payment:document.getElementById("payment").value
});

localStorage.setItem("bmt_sales",JSON.stringify(sales));
render();
alert("Sale saved successfully");
}
document.getElementById("date").value=new Date().toISOString().slice(0,10);
render();
</script>
</body>
</html>
