
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMT Admin Dashboard</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      color: #172b4d;
    }

    header {
      background: #123b70;
      color: white;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h1 { margin: 0; font-size: 22px; }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    #logoutButton {
      background: white;
      color: #123b70;
    }

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .welcome, .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }

    .welcome h2 { margin-top: 0; }

    #status {
      color: #64748b;
      overflow-wrap: anywhere;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 15px;
    }

    .metric {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }

    .metric h3 {
      margin: 0 0 12px;
      color: #64748b;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .metric p {
      margin: 0;
      font-size: 23px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .modules {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .module {
      background: #eaf1fa;
      padding: 17px;
      border-radius: 9px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>Babar Mobile Trader</h1>
    <button id="logoutButton">Logout</button>
  </header>

  <main>

    <section class="welcome">
      <h2>Admin Dashboard</h2>
      <p id="welcomeText">Checking account...</p>
      <p id="status">Please wait...</p>
    </section>

    <h2>Business Summary</h2>
    <section id="metrics" class="metrics">
      <div class="metric">Loading business figures...</div>
    </section>

    <section class="panel">
      <h2>System Modules</h2>
      <div class="modules">
        <div class="module">Purchases</div>
        <div class="module">Sales</div>
        <div class="module">Stock</div>
        <div class="module">Customers</div>
        <div class="module">Suppliers</div>
        <div class="module">Payments</div>
        <div class="module">Receipts</div>
        <div class="module">Expenses</div>
        <div class="module">IMEI Search</div>
        <div class="module">Reports</div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    const statusText = document.getElementById("status");
    const welcomeText = document.getElementById("welcomeText");
    const metrics = document.getElementById("metrics");

    async function loadDashboard() {
      try {
        const { data: sessionData, error: sessionError } =
          await window.bmtSupabase.auth.getSession();

        if (sessionError) throw sessionError;

        const user = sessionData.session?.user;

        if (!user) {
          window.location.href = "login.html";
          return;
        }

        const { data: profile, error: profileError } =
          await window.bmtSupabase
            .from("profiles")
            .select("full_name, role, is_active")
            .eq("id", user.id)
            .maybeSingle();

        if (profileError) throw profileError;

        if (!profile || profile.role !== "admin" || profile.is_active !== true) {
          statusText.textContent = "Access denied. Admin account required.";
          return;
        }

        welcomeText.textContent =
          "Welcome, " + (profile.full_name || user.email);

        statusText.textContent = "Admin account verified.";

        const { data: summary, error: summaryError } =
          await window.bmtSupabase
            .from("dashboard_summary")
            .select("*");

        if (summaryError) throw summaryError;

        metrics.innerHTML = "";

        if (!summary || summary.length === 0) {
          metrics.textContent = "No dashboard figures found.";
          return;
        }

        const row = summary[0];

        Object.entries(row).forEach(([key, value]) => {
          const card = document.createElement("div");
          card.className = "metric";

          const heading = document.createElement("h3");
          heading.textContent = key.replace(/_/g, " ");

          const figure = document.createElement("p");
          figure.textContent =
            value === null ? "—" :
            typeof value === "number" ?
            value.toLocaleString() : String(value);

          card.appendChild(heading);
          card.appendChild(figure);
          metrics.appendChild(card);
        });

      } catch (error) {
        statusText.textContent = "Error: " + error.message;
        metrics.textContent = "Dashboard could not be loaded.";
      }
    }

    document.getElementById("logoutButton")
      .addEventListener("click", async function() {
        const { error } = await window.bmtSupabase.auth.signOut();

        if (error) {
          alert(error.message);
          return;
        }

        window.location.href = "login.html";
      });

    loadDashboard();
  </script>

</body>
</html>
