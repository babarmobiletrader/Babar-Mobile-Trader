<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#0b0d10">

<meta name="description" content="Babar Mobile Trader — premium smartphones, carefully selected used mobiles and box-pack devices in Karachi.">

<title>Babar Mobile Trader | Premium Smartphones</title>

<style>

:root{--ink:#0b0d10;--muted:#69707a;--line:#e7e9ec;--paper:#fff;--soft:#f5f6f7;--dark:#0b0d10;--dark2:#14181d;--accent:#25d366;--radius:22px;--shadow:0 20px 60px rgba(15,18,22,.10)}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#fff;line-height:1.5}

a{text-decoration:none;color:inherit}

button,input{font:inherit}

.container{width:min(1180px,calc(100% - 36px));margin:auto}

.top{background:#0b0d10;color:#fff;font-size:12px;padding:9px 0}

.top .container{display:flex;justify-content:space-between;gap:15px}

.top a{opacity:.85}

header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(231,233,236,.8)}

.nav{height:78px;display:flex;align-items:center;justify-content:space-between;gap:24px}

.brand{display:flex;align-items:center;gap:12px}

.mark{width:44px;height:44px;border:2px solid #0b0d10;border-radius:13px;display:grid;place-items:center;font-weight:900;letter-spacing:-2px}

.brand strong{font-size:16px;display:block}

.brand small{color:var(--muted);font-size:10px;letter-spacing:1.4px;text-transform:uppercase}

.brand-logo{width:300px;height:58px;object-fit:contain;object-position:left center;display:block}

.btn.contact-bmt{background:#25d366;color:#07170c;border-color:#25d366;gap:9px}

.btn.contact-bmt img{height:24px;width:auto;max-width:78px;object-fit:contain;display:block;background:#fff;border-radius:4px;padding:1px}

.stamp-strip{margin-top:22px;background:#fff;border-radius:12px;padding:8px 18px;height:112px;display:flex;align-items:center;justify-content:center;overflow:hidden}

.stamp-strip img{height:96px;width:auto;max-width:100%;object-fit:contain;display:block}

.links{display:flex;gap:25px;font-size:13px;font-weight:700}

.links a:hover{text-decoration:underline}

.menu{display:none;border:0;background:transparent;font-size:25px}

.hero{background:radial-gradient(circle at 78% 32%,rgba(124,45,67,.55),transparent 32%),linear-gradient(135deg,#24151b,#4b2430 48%,#171116);color:#fff;overflow:hidden}

.hero-inner{min-height:610px;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:40px}

.eyebrow{font-size:11px;letter-spacing:3px;font-weight:800;color:#aeb5bd}

.hero h1{font-size:clamp(44px,7vw,82px);line-height:.94;letter-spacing:-5px;margin:16px 0 24px;max-width:700px}

.hero p{font-size:18px;color:#c9ced4;max-width:570px}

.pill{display:inline-flex;padding:9px 13px;border:1px solid #3a4048;border-radius:999px;font-size:12px;margin-top:8px}

.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}

.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border-radius:12px;border:1px solid #333a43;font-weight:800;font-size:13px}

.btn.light{background:#fff;color:#0b0d10;border-color:#fff}

.btn.dark{background:#111;color:#fff}

.hero-art{height:430px;border-radius:36px;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.12),transparent 42%),linear-gradient(145deg,#6b3546,#321c25);position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;overflow:hidden}

.phone{display:none;position:absolute;width:190px;height:370px;border:7px solid #15181c;border-radius:34px;background:linear-gradient(145deg,#5b6570,#1c2228);box-shadow:0 35px 70px rgba(0,0,0,.45);left:50%;top:50%;transform:translate(-50%,-50%) rotate(8deg)}

.phone:before{content:"";position:absolute;inset:7px;border-radius:25px;background:radial-gradient(circle at 30% 20%,#748292,transparent 28%),linear-gradient(145deg,#27313b,#0d1217)}

.camera{position:absolute;width:66px;height:72px;left:10px;top:10px;border-radius:17px;background:#171b20;z-index:2;box-shadow:inset 0 0 0 2px #353c43}

.camera i{position:absolute;width:22px;height:22px;border-radius:50%;background:#080a0d;border:3px solid #56606a}

.camera i:nth-child(1){left:9px;top:9px}

.camera i:nth-child(2){right:8px;top:9px}

.camera i:nth-child(3){left:9px;bottom:8px}

.hero-product-image{width:min(70%,420px);height:450px;object-fit:contain;filter:drop-shadow(0 35px 35px rgba(0,0,0,.38));position:relative;z-index:2}

.hero-image-label{position:absolute;right:24px;bottom:22px;z-index:3;background:rgba(15,10,13,.58);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);border-radius:15px;padding:11px 14px}

.hero-image-label b{display:block;font-size:13px}

.hero-image-label span{display:block;color:#e7dce0;font-size:10px;margin-top:2px}

.product-img,.box-card .visual{background:linear-gradient(145deg,#eef6fb,#e6dce2)}

.real-product-image{width:100%;height:100%;object-fit:contain;padding:20px;filter:drop-shadow(0 18px 20px rgba(0,0,0,.18));position:relative;z-index:1}

.section{padding:88px 0}

.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:30px}

.section h2{font-size:42px;letter-spacing:-2px;margin:5px 0}

.section-head p{color:var(--muted);margin:0;max-width:540px}

.kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:#777}

.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}

.cat{padding:28px;border:1px solid var(--line);border-radius:20px;min-height:155px;transition:.25s}

.cat:hover{transform:translateY(-4px);box-shadow:var(--shadow)}

.cat b{font-size:19px}

.cat span{display:block;color:var(--muted);font-size:13px;margin-top:8px}

.cat .num{font-size:11px;color:#9aa0a7;margin-bottom:35px}

.dark-section{background:#0b0d10;color:#fff}

.dark-section .section-head p{color:#aeb4bb}

.search{width:100%;padding:15px 18px;border:1px solid #30353b;border-radius:13px;background:#121519;color:#fff;outline:0}

.search:focus{border-color:#69727c}

.products{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

.product{background:#fff;color:#0b0d10;border-radius:22px;overflow:hidden;border:1px solid #e6e8eb;box-shadow:0 8px 25px rgba(0,0,0,.05)}

.product-img{height:290px;background:linear-gradient(145deg,#f0f2f4,#d9dde1);display:grid;place-items:center;position:relative}

.product-img .mini-phone{width:128px;height:245px;border:6px solid #171a1d;border-radius:25px;background:linear-gradient(145deg,#59626c,#151a1f);box-shadow:0 20px 30px rgba(0,0,0,.2);position:relative}

.mini-phone:after{content:"";position:absolute;width:42px;height:49px;left:8px;top:8px;border-radius:13px;background:#16191d}

.badge{position:absolute;top:15px;left:15px;background:#0b0d10;color:#fff;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900}

.product-body{padding:20px}

.product h3{margin:4px 0;font-size:20px;letter-spacing:-.5px}

.meta{color:#737982;font-size:12px}

.swatches{display:flex;gap:7px;margin:15px 0}

.swatch{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c9cdd1}

.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}

.spec{background:#f5f6f7;padding:9px 10px;border-radius:10px;font-size:11px}

.spec b{display:block;font-size:9px;text-transform:uppercase;color:#8a9097;letter-spacing:.7px}

.price{font-size:24px;font-weight:900;margin:16px 0}

.p-actions{display:flex;gap:9px}

.p-actions a{flex:1;text-align:center;padding:11px;border-radius:10px;font-size:12px;font-weight:900}

.wa{background:#25d366;color:#07170c}

.mail{background:#0b0d10;color:#fff}

.light-section{background:#f7f7f6}

.box-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

.box-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}

.box-card .visual{height:190px;border-radius:15px;background:linear-gradient(145deg,#eef0f2,#d9dde0);display:grid;place-items:center;margin-bottom:18px}

.box-card .visual div{width:88px;height:150px;border:5px solid #15181c;border-radius:21px;background:linear-gradient(145deg,#66717b,#1b2025)}

.box-card h3{margin:5px 0;font-size:18px}

.box-card p{margin:0;color:var(--muted);font-size:12px}

.box-price{font-weight:900;font-size:20px;margin-top:14px}

.access-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

.access{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px}

.access .icon{font-size:34px}

.access h3{margin:15px 0 5px}

.access p{color:var(--muted);font-size:13px}

.contact{background:#0b0d10;color:#fff}

.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}

.contact h2{font-size:48px;line-height:1;letter-spacing:-2px}

.contact-card{border:1px solid #30353b;border-radius:20px;padding:25px}

.contact-row{padding:14px 0;border-bottom:1px solid #292e34}

.contact-row:last-child{border:0}

.contact-row small{display:block;color:#8e969f;font-size:10px;text-transform:uppercase;letter-spacing:1px}

.contact-row a{font-weight:700}

.footer{background:#07090b;color:#a9afb6;border-top:1px solid #24282d;padding:25px 0;font-size:11px}

.footer .container{display:flex;justify-content:space-between;gap:20px}

.empty{padding:35px;border:1px dashed #555;border-radius:15px;text-align:center;color:#9ba1a8;grid-column:1/-1}

.hide{display:none!important}

@media(max-width:900px){

.hero-inner{grid-template-columns:1fr;padding:70px 0}

.hero-art{height:330px}

.hero-product-image{height:300px}

.categories,.products,.box-grid,.access-grid{grid-template-columns:repeat(2,1fr)}

.contact-grid{grid-template-columns:1fr}

.links{display:none}

.menu{display:block}

.links.open{display:flex;position:absolute;left:0;right:0;top:78px;background:#fff;padding:20px;flex-direction:column;border-bottom:1px solid var(--line)}

}

@media(max-width:620px){

.brand-logo{width:230px;height:52px}

.container{width:min(100% - 24px,1180px)}

.top .container{flex-direction:column;gap:4px}

.hero h1{letter-spacing:-2px}

.section{padding:60px 0}

.section h2{font-size:32px}

.section-head{align-items:start;flex-direction:column}

.products,.box-grid,.access-grid,.categories{grid-template-columns:1fr}

.product-img{height:260px}

.contact h2{font-size:40px}

.footer .container{flex-direction:column}

}

</style>
