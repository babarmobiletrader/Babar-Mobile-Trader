<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BABAR MOBILE TRADER</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fc;color:#102b50}
.page{max-width:1100px;margin:auto;background:#fff}
header{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 8px}
.logo{width:76px;height:58px;display:flex;align-items:center;justify-content:center;position:relative;color:#0875d1;font-size:29px;font-weight:900;letter-spacing:-3px}
.logo:before{content:"";position:absolute;width:53px;height:45px;border:4px solid #0875d1;border-radius:10px;transform:skew(-8deg)}
.logo span{position:relative}
.brand{border-left:3px solid #0875d1;padding-left:12px}
.brand h1{margin:0;color:#0758ae;font-size:clamp(16px,3.6vw,28px);font-weight:900}
.brand p{margin:5px 0 0;color:#1286d5;font-size:clamp(8px,1.7vw,13px);font-weight:bold;letter-spacing:1.5px}
nav{display:flex;justify-content:space-around;background:linear-gradient(90deg,#0878e8,#0349ac);overflow-x:auto}
nav a{color:white;text-decoration:none;font-size:11px;font-weight:bold;padding:15px 10px;white-space:nowrap}
nav a:first-child{background:#12a5ef}
.search{background:#086bce;padding:8px 4%}
.search input{width:100%;height:34px;border:0;border-radius:22px;padding:0 14px;font-size:13px}
.hero{position:relative;overflow:hidden;min-height:275px;padding:27px 4%;color:#fff;background:radial-gradient(ellipse at 72% 70%,#168df0,#0750b6 43%,#04153f 84%)}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(155deg,transparent 0 32px,#5bd2ff13 33px 35px)}
.copy{position:relative;z-index:2;width:55%}
.bmt{font-size:clamp(32px,5vw,48px);font-weight:900;line-height:.9}
h2{font-size:clamp(21px,4.2vw,37px);line-height:1;margin:10px 0 0;font-weight:900}
h3{font-size:clamp(20px,4.2vw,36px);line-height:1;margin:0 0 10px;color:#23e3ef;font-weight:900}
.copy p{font-size:12px;line-height:1.5;margin:0 0 12px}
.cta{display:inline-block;background:white;color:#0757b1;padding:10px 16px;border-radius:24px;font-weight:bold;font-size:11px;text-decoration:none}
.approved{position:absolute;right:5%;top:10%;z-index:2;color:#ffdf38;font-size:clamp(12px,2vw,19px);font-weight:900;font-style:italic;text-align:center;transform:rotate(-7deg);text-shadow:1px 2px #12274c}
.approved small{display:block;color:white;font-size:10px}
.phones{position:absolute;right:2%;bottom:30px;width:48%;height:160px;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.phone{position:relative;flex:0 1 48px;height:125px;min-width:20px;border:3px solid #d8e3ef;border-radius:8px;background:#101a31;box-shadow:0 5px 12px #0008;overflow:hidden}
.phone:nth-child(2),.phone:nth-child(5){height:145px}
.phone:nth-child(3),.phone:nth-child(4){height:132px}
.phone:before{content:"";position:absolute;z-index:2;top:4px;left:30%;width:40%;height:5px;border-radius:5px;background:#080e1c}
.phone:after{content:"";position:absolute;inset:12px 3px 4px;border-radius:4px;background:linear-gradient(145deg,#eaf3ff,#73a9ec 30%,#1d3976 62%,#101426)}
.phone:nth-child(2):after{background:radial-gradient(circle at 70% 20%,#fff,#7098d2 15%,#173461 50%,#0c1022)}
.phone:nth-child(3):after{background:linear-gradient(140deg,#e9efff,#36305e 40%,#090c1c 70%,#a28aff)}
.phone:nth-child(4):after{background:linear-gradient(135deg,#fae6e6,#e83358 35%,#351034 65%,#090b1d)}
.phone:nth-child(5):after{background:linear-gradient(140deg,#e3e7ef,#5d7b98 35%,#172538 70%,#d5f0ff)}
.phone:nth-child(6):after{background:linear-gradient(135deg,#c7d4e3,#202d48 45%,#070b19 75%,#68bfff)}
.dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.dots i{width:6px;height:6px;background:#ffffff70;border-radius:50%}
.dots i:first-child{background:white}
.social{position:absolute;right:12px;bottom:8px;color:white;font-size:10px;letter-spacing:4px}
@media(max-width:370px){
header{gap:7px}.logo{width:58px;font-size:25px}
.brand{padding-left:8px}.brand p{letter-spacing:1px}
.hero{min-height:255px}.copy{width:56%}
.phones{width:47%;gap:2px}
.phone{height:100px}
.phone:nth-child(2),.phone:nth-child(5){height:118px}
.phone:nth-child(3),.phone:nth-child(4){height:110px}
}
</style>
</head>

<body>
<div class="page">

<header>
  <div class="logo"><span>BMT</span></div>
  <div class="brand">
    <h1>BABAR MOBILE TRADER</h1>
    <p>TRUST • QUALITY • CONNECTIVITY</p>
  </div>
</header>

<nav>
  <a href="#home">☰ HOME</a>
  <a href="#home">MOBILE PHONES</a>
  <a href="#home">ACCESSORIES</a>
  <a href="#home">CONTACT US</a>
</nav>

<div class="search">
  <input type="search" placeholder="Search mobiles, brands and accessories...">
</div>

<section class="hero" id="home">
  <div class="copy">
    <div class="bmt">BMT</div>
    <h2>SMARTPHONES</h2>
    <h3>BEST DEALS</h3>
    <p>Premium mobiles. Trusted quality.</p>
    <a class="cta" href="#home">EXPLORE NOW &nbsp; ➜</a>
  </div>

  <div class="approved">
    PTA APPROVED
    <small>QUALITY YOU CAN TRUST</small>
  </div>

  <div class="phones">
    <div class="phone"></div>
    <div class="phone"></div>
    <div class="phone"></div>
    <div class="phone"></div>
    <div class="phone"></div>
    <div class="phone"></div>
  </div>

  <div class="dots"><i></i><i></i><i></i><i></i></div>
  <div class="social">f ◎ ▶️</div>
</section>

</div>
</body>
</html>
