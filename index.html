<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<title>ٹونی اسٹارک ٹیمپلیٹ</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    direction: rtl;
  }

  nav {
    background: #000;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  nav a {
    color: #ffd700;
    text-decoration: none;
    margin-left: 15px;
  }

  .hero {
    text-align: center;
    padding: 80px 20px;
    background: radial-gradient(circle, #3a0000, #000);
  }

  h1 {
    color: #ffd700;
    font-size: 48px;
    margin: 10px 0;
  }

  .arc {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff, #00e5ff, #0077ff);
    box-shadow: 0 0 40px #00e5ff, 0 0 80px #0077ff;
    margin: 20px auto;
    animation: pulse 1.5s infinite alternate;
  }

  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.1); }
  }

  .section {
    padding: 40px 20px;
    max-width: 800px;
    margin: auto;
  }

  .btn {
    display: inline-block;
    background: #b11313;
    color: #fff;
    padding: 12px 24px;
    text-decoration: none;
    border-radius: 30px;
    margin-top: 20px;
  }

  footer {
    text-align: center;
    padding: 20px;
    background: #000;
    color: #888;
  }
</style>
</head>
<body>

<nav>
  <strong>اسٹارک انڈسٹریز</strong>
  <div>
    <a href="#">ہوم</a>
    <a href="#tech">ٹیکنالوجی</a>
    <a href="#contact">رابطہ</a>
  </div>
</nav>

<div class="hero">
  <div class="arc"></div>
  <h1>ٹونی اسٹارک</h1>
  <p>جینیس۔ ارب پتی۔ پلے بوائے۔ انسان دوست۔</p>
  <a href="#tech" class="btn">لیب میں داخل ہوں</a>
</div>

<div class="section" id="tech">
  <h2>آرک ری ایکٹر</h2>
  <p>صاف توانائی۔ اسٹارک ٹیکنالوجی سے چلنے والی۔</p>
</div>

<div class="section" id="contact">
  <h2>رابطہ</h2>
  <p>ای میل: tony@stark.com</p>
</div>

<footer>
  <p>© 2026 اسٹارک انڈسٹریز</p>
</footer>

</body>
</html>
