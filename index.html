<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MBT Mobile Logo</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f0f0f0;
    margin: 0;
  }
</style>
</head>
<body>

<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

  <!-- Circle Background -->
  <circle cx="200" cy="200" r="180" fill="#0d1b2a" stroke="#00e5ff" stroke-width="6"/>

  <!-- Mobile Phone Body -->
  <rect x="130" y="70" width="140" height="250" rx="20" fill="#111" stroke="#ffd700" stroke-width="4"/>

  <!-- Screen -->
  <rect x="145" y="90" width="110" height="200" rx="8" fill="#00e5ff" opacity="0.15"/>

  <!-- MBT on Screen -->
  <text x="200" y="205" text-anchor="middle" font-size="60" font-weight="bold"
        fill="#ffd700" font-family="Arial">MBT</text>

  <!-- Speaker -->
  <line x1="180" y1="80" x2="220" y2="80" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>

  <!-- Home Button -->
  <circle cx="200" cy="305" r="6" fill="#ffd700"/>

  <!-- Full Name -->
  <text x="200" y="360" text-anchor="middle" font-size="16" fill="#ffffff"
        font-family="Arial" letter-spacing="2">BABAR MOBILE TRADER</text>

</svg>

</body>
</html>
