<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BMT — Babar Mobile Trader</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6f8;
    color:#111;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:92%;
    max-width:1200px;
    margin:auto;
}

/* ================= HEADER ================= */

header{
    background:#fff;
    border-bottom:1px solid #e5e5e5;
    position:sticky;
    top:0;
    z-index:1000;
}

.navbar{
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-box{
    width:48px;
    height:48px;
    background:#111;
    color:white;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:18px;
}

.logo-text{
    font-size:20px;
    font-weight:900;
}

.menu{
    display:flex;
    gap:28px;
    font-size:14px;
    font-weight:bold;
}

.menu a:hover{
    color:#168b4b;
}

/* ================= HERO ================= */

.hero{
    padding:90px 0;
    background:
    radial-gradient(circle at 80% 20%,#dfe5ed,transparent 35%),
    linear-gradient(135deg,#ffffff,#edf0f4);
}

.hero-content{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    align-items:center;
    gap:50px;
}

.small-title{
    color:#b3872c;
    font-size:13px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
}

.hero h1{
    font-size:clamp(45px,6vw,75px);
    line-height:1;
    letter-spacing:-4px;
    margin:18px 0;
}

.hero h1 span{
    display:block;
}

.hero p{
    color:#6b7078;
    font-size:18px;
    line-height:1.7;
    max-width:650px;
}

.hero-buttons{
    margin-top:30px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.button{
    padding:14px 21px;
    border-radius:11px;
    font-weight:800;
    display:inline-block;
}

.button-black{
    background:#111;
    color:#fff;
}

.button-green{
    background:#159447;
    color:#fff;
}

.hero-phone{
    width:245px;
    height:410px;
    margin:auto;
    border-radius:40px;
    padding:10px;
    background:linear-gradient(145deg,#111,#555);
    transform:rotate(5deg);
    box-shadow:0 35px 70px rgba(0,0,0,.2);
}

.hero-screen{
    width:100%;
    height:100%;
    border-radius:32px;
    background:
    radial-gradient(circle at 50% 25%,#56657a,#151923 48%,#050505);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:45px;
    font-weight:900;
    position:relative;
}

.dynamic-island{
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    width:90px;
    height:24px;
    background:#050505;
    border-radius:20px;
}

/* ================= TRUST ================= */

.trust{
    background:#111;
    color:#fff;
}

.trust-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.trust-box{
    text-align:center;
    padding:22px 10px;
    font-size:13px;
    color:#cbd0d7;
}

.trust-box strong{
    display:block;
    color:white;
    margin-bottom:5px;
}

/* ================= SECTION ================= */

section{
    padding:75px 0;
}

.section-heading{
    margin-bottom:30px;
}

.section-heading h2{
    font-size:40px;
    letter-spacing:-2px;
    margin-bottom:8px;
}

.section-heading p{
    color:#6d737c;
    line-height:1.6;
}

/* ================= SPECIAL DEAL ================= */

.special-deal{
    background:#111;
    color:#fff;
    border-radius:24px;
    padding:32px;
    margin-bottom:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.special-deal h3{
    font-size:27px;
    margin-bottom:8px;
}

.special-deal p{
    color:#cbd0d7;
}

.deal-label{
    background:#b3872c;
    padding:11px 17px;
    border-radius:30px;
    font-weight:900;
    white-space:nowrap;
}

/* ================= FILTERS ================= */

.filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:28px;
}

.filter{
    border:1px solid #ddd;
    background:white;
    border-radius:30px;
    padding:10px 17px;
    cursor:pointer;
    font-weight:bold;
}

.filter.active{
    background:#111;
    color:white;
}

/* ================= PRODUCTS ================= */

.product-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.product-card{
    background:white;
    border:1px solid #e4e6e9;
    border-radius:22px;
    overflow:hidden;
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-5px);
    box-shadow:0 18px 40px rgba(0,0,0,.08);
}

/* IMAGE */

.product-gallery{
    background:#f0f1f3;
    padding:15px;
}

.main-image{
    width:100%;
    height:260px;
    object-fit:contain;
    background:white;
    border-radius:16px;
}

.thumbnails{
    display:flex;
    gap:8px;
    margin-top:9px;
}

.thumbnail{
    width:55px;
    height:48px;
    object-fit:cover;
    border-radius:8px;
    border:2px solid transparent;
    cursor:pointer;
    background:white;
}

.thumbnail.active{
    border-color:#111;
}

/* INFO */

.product-info{
    padding:20px;
}

.category{
    font-size:11px;
    font-weight:900;
    color:#777;
    letter-spacing:1px;
    text-transform:uppercase;
}

.product-info h3{
    margin:7px 0;
    font-size:21px;
}

.specification{
    color:#6d737c;
    font-size:13px;
    line-height:1.6;
    margin-bottom:13px;
}

.color-list{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:15px;
}

.color{
    border:1px solid #ddd;
    padding:6px 9px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
}

.price{
    font-size:24px;
    font-weight:900;
    margin-bottom:12px;
}

.available{
    color:#159447;
    font-size:12px;
    font-weight:900;
    margin-bottom:14px;
}

.out-stock{
    color:#c92d2d;
    font-size:12px;
    font-weight:900;
    margin-bottom:14px;
}

.product-buttons{
    display:flex;
    gap:8px;
}

.product-buttons a{
    flex:1;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-size:13px;
    font-weight:900;
}

.whatsapp{
    background:#159447;
    color:white;
}

.details{
    background:#f0f1f3;
}

/* ================= ABOUT ================= */

.about{
    background:white;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
}

.about h2{
    font-size:42px;
    letter-spacing:-2px;
    margin:15px 0;
}

.about p{
    color:#6d737c;
    line-height:1.8;
}

.contact-card{
    background:#111;
    color:white;
    border-radius:24px;
    padding:32px;
}

.contact-card p{
    color:#cbd0d7;
    margin:10px 0;
}

.contact-line{
    padding:15px 0;
    border-bottom:1px solid #30343a;
}

.contact-line:last-child{
    border-bottom:0;
}

/* ================= FOOTER ================= */

footer{
    background:#090a0c;
    color:#9ca3af;
    padding:35px 0;
}

.footer{
    display:flex;
    justify-content:space-between;
    gap:20px;
}

.footer strong{
    color:white;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

    .hero-content{
        grid-template-columns:1fr;
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .trust-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .about-grid{
        grid-template-columns:1fr;
    }
}

    .menu{
        display:none;
    }

    .hero{
        padding:60px 0;
    }

        letter
