
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMT Admin Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; background: #f2f5fa;
      font-family: Arial, sans-serif; color: #172b4d;
    }
    .login-card {
      width: 100%; max-width: 420px; background: white; padding: 32px;
      border-radius: 16px; box-shadow: 0 12px 35px rgba(11,31,66,.12);
    }
    h1 { text-align: center; color: #123b70; font-size: 25px; }
    p { text-align: center; color: #66758a; }
    label { display: block; margin: 18px 0 7px; font-weight: bold; }
    input {
      width: 100%; padding: 13px; border: 1px solid #cbd5e1;
      border-radius: 9px; font-size: 16px;
    }
    button {
      width: 100%; margin-top: 22px; padding: 14px;
      border: 0; border-radius: 9px; background: #123b70;
      color: white; font-size: 16px; font-weight: bold;
    }
    #message { margin-top: 16px; font-size: 14px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Babar Mobile Trader</h1>
    <p>Admin Login</p>

    <form id="loginForm">
      <label>Email Address</label>
      <input id="email" type="email"
        value="info@babarmobiletrader.com" required>

      <label>Password</label>
      <input id="password" type="password"
        placeholder="Enter your password" required>

      <button id="loginButton" type="submit">Login</button>
    </form>

    <div id="message"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const button = document.getElementById("loginButton");
      const message = document.getElementById("message");

      button.disabled = true;
      button.textContent = "Please wait...";

      try {
        const { data, error } = await window.bmtSupabase.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) throw error;

        message.style.color = "green";
        window.location.href = "admin.html";
      } catch (error) {
        message.style.color = "red";
        message.textContent = error.message;
      }

      button.disabled = false;
      button.textContent = "Login";
    });
  </script>
</body>
</html>
