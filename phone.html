<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Babar Mobile Trader</title>
<style>
  body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
  header{background:#111;padding:12px 16px}
  header a{color:#fff;text-decoration:none;font-weight:bold}
  .wrap{max-width:600px;margin:0 auto;padding:16px}
  #main{width:100%;border-radius:12px;background:#fff;aspect-ratio:1/1;object-fit:contain}
  #thumbs{display:flex;gap:8px;margin:10px 0;overflow-x:auto}
  #thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;background:#fff}
  #thumbs img.active{border-color:#25d366}
  h1{font-size:22px;margin:8px 0}
  .price{font-size:24px;font-weight:bold;color:#0a7d2c}
  .old{text-decoration:line-through;color:#888;margin-left:8px;font-size:16px;font-weight:normal}
  .tags span{display:inline-block;background:#e8f5e9;border-radius:20px;padding:4px 12px;margin:4px 4px 4px 0;font-size:14px}
  .box{background:#fff;border-radius:12px;padding:12px 16px;margin:12px 0;line-height:1.7}
  .wa{display:block;text-align:center;background:#25d366;color:#fff;text-decoration:none;font-weight:bold;padding:14px;border-radius:12px;font-size:18px}
</style>
</head>
<body>
<header><a href="index.html">← BMT</a></header>
<div class="wrap" id="app">Loading...</div>

<script>
var WA = "923122741845";
var LOGO = "IMG_4176.jpg";
var app = document.getElementById("app");

function el(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

var name = (new URLSearchParams(location.search).get("name") || "").trim();

fetch("products.json")
  .then(function(r){ return r.json(); })
  .then(function(data){
    var list = Array.isArray(data) ? data : (data.products || []);
    var p = list.find(function(x){ return String(x.name).trim() === name; });
    app.textContent = "";
    if(!p){ app.textContent = "Phone not found."; return; }

    document.title = p.name.trim() + " | Babar Mobile Trader";

    var pics = [];
    if(p.gallery){
      pics = String(p.gallery).split(",").map(function(s){ return s.trim(); }).filter(Boolean);
    }
    if(p.img){ pics.unshift(String(p.img).trim()); }
    pics = pics.filter(function(v,i){ return pics.indexOf(v) === i; });

    var main = el("img"); main.id = "main"; main.src = pics[0] || ""; main.alt = p.name;
    app.appendChild(main);

    var thumbs = el("div"); thumbs.id = "thumbs";
    pics.forEach(function(u, i){
      var t = el("img", i === 0 ? "active" : ""); t.src = u; t.alt = p.name;
      t.onclick = function(){
        main.src = u;
        thumbs.querySelectorAll("img").forEach(function(x){ x.classList.remove("active"); });
        t.classList.add("active");
      };
      thumbs.appendChild(t);
    });
    if(pics.length > 1) app.appendChild(thumbs);

    app.appendChild(el("h1", "", p.name.trim()));

    var pr = el("div", "price");
    if(p.price){
      pr.textContent = "Rs " + Number(p.price).toLocaleString();
      if(p.oldPrice){ pr.appendChild(el("span", "old", "Rs " + Number(p.oldPrice).toLocaleString())); }
    } else {
      pr.textContent = "Ask for price on WhatsApp";
    }
    app.appendChild(pr);

    var tags = el("div", "tags");
    [p.condition, p.pta, p.spec, p.brand, p.stock].forEach(function(v){
      if(v && String(v).trim()){ tags.appendChild(el("span", "", String(v).trim())); }
    });
    app.appendChild(tags);

    if(p.description){
      var d = el("div", "box"); d.appendChild(el("b", "", "Details")); d.appendChild(el("div", "", p.description));
      app.appendChild(d);
    }

    var c = String(p.condition || "").trim().toLowerCase();
    var ptaText = String(p.pta || "").trim().toLowerCase();
    var SHIELD = "M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z";
    var CHECK = "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z";
    var TRUCK = "M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z";

    var items = [{ logo: true }];
    if (ptaText.indexOf("approved") > -1 && ptaText.indexOf("non") === -1) {
      items.push({ icon: SHIELD, text: "PTA Approved" });
    }
    if (c === "new") {
      items.push({ icon: CHECK, text: "1 Year Company Warranty" });
    } else if (c === "used") {
      items.push({ icon: CHECK, text: "7 Days Checking Warranty" });
    }
    items.push({ icon: TRUCK, text: "Fast Delivery" });

    var row = el("div", "box");
    row.style.cssText = "display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px";
    items.forEach(function(it){
      var b = el("div");
      b.style.cssText = "display:flex;align-items:center;gap:8px;background:#eef8f1;border-radius:10px;padding:10px;font-size:13px;font-weight:bold;line-height:1.3";
      if (it.logo) {
        b.style.justifyContent = "center";
        var im = el("img");
        im.src = LOGO;
        im.alt = "BMT";
        im.style.cssText = "height:34px;width:auto;max-width:100%;object-fit:contain;border-radius:6px";
        im.onerror = function(){ im.style.display = "none"; };
        b.appendChild(im);
      } else {
        var s = document.createElement("span");
        s.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="#0a7d2c"><path d="' + it.icon + '"/></svg>';
        s.style.cssText = "display:flex;flex:none";
        b.appendChild(s);
        b.appendChild(el("span", "", it.text));
      }
      row.appendChild(b);
    });
    app.appendChild(row);

    var why = el("div", "box");
    why.appendChild(el("b", "", "Why choose BMT"));
    [
      "PTA approved",
      "Company warranty on box pack, 7 days checking warranty on used",
      "Real photos and stock confirmed on WhatsApp"
    ].forEach(function(t){
      why.appendChild(el("div", "", "✓ " + t));
    });
    app.appendChild(why);

    var priceTxt = p.price ? " Price: Rs " + Number(p.price).toLocaleString() + "." : "";
    var orderMsg = "Hello, I want to confirm my order for " + p.name.trim() + "." + priceTxt + " " + location.href;
    var o = el("a", "wa", "Confirm Order");
    o.href = "https://wa.me/" + WA + "?text=" + encodeURIComponent(orderMsg);
    app.appendChild(o);

    var askMsg = "Hello, I want details about " + p.name.trim() + ". " + location.href;
    var a = el("a", "wa", "Ask on WhatsApp");
    a.style.cssText = "background:#111;margin-top:10px";
    a.href = "https://wa.me/" + WA + "?text=" + encodeURIComponent(askMsg);
    app.appendChild(a);
  })
  .catch(function(){ app.textContent = "Could not load data."; });
</script>
</body>
</html>
