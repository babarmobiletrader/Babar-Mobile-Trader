
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMT Reset Password</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      color: #172b4d;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      color: #123b70;
      font-size: 24px;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #123b70;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Babar Mobile Trader</h1>
    <p>Reset Your Password</p>

    <form id="resetForm">
      <label>New Password</label>
      <input id="password" type="password"
        minlength="8" placeholder="Enter new password" required>

      <label>Confirm New Password</label>
      <input id="confirmPassword" type="password"
        minlength="8" placeholder="Confirm new password" required>

      <button id="resetButton" type="submit">
        Save New Password
      </button>
    </form>

    <div id="message"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const button = document.getElementById("resetButton");

    async function checkRecoverySession() {
      const { data, error } =
        await window.bmtSupabase.auth.getSession();

      if (error) {
        message.style.color = "red";
        message.textContent = error.message;
        return;
      }

      if (!data.session) {
        message.style.color = "red";
        message.textContent =
          "Reset link is invalid or expired. Please request a new password reset email.";
      }
    }

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.style.color = "red";
        message.textContent =
          "Password must contain at least 8 characters.";
        return;
      }

      if (password !== confirmPassword) {
        message.style.color = "red";
        message.textContent = "Passwords do not match.";
        return;
      }

      button.disabled = true;
      button.textContent = "Saving...";

      try {
        const { data: sessionData, error: sessionError } =
          await window.bmtSupabase.auth.getSession();

        if (sessionError) throw sessionError;
        if (!sessionData.session) {
          throw new Error("Reset link is invalid or expired. Request a new one.");
        }

        const { error } =
          await window.bmtSupabase.auth.updateUser({
            password: password
          });

        if (error) throw error;

        message.style.color = "green";
        message.textContent =
          "Password changed successfully. Please go to Admin Login.";

        form.reset();

      } catch (error) {
        message.style.color = "red";
        message.textContent = error.message;
      }

      button.disabled = false;
      button.textContent = "Save New Password";
    });

    checkRecoverySession();
  </script>
</body>
</html>
