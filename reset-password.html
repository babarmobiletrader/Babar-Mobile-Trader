
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMT - Reset Password</title>
<style>
body{font-family:Arial;background:#f2f5fa;margin:0;padding:20px}
.box{max-width:400px;margin:70px auto;background:white;padding:25px;border-radius:12px}
h2{color:#123d70}
input,button{width:100%;padding:13px;margin:9px 0;box-sizing:border-box;border-radius:7px}
input{border:1px solid #ccc}
button{background:#123d70;color:white;border:0;font-weight:bold}
#message{font-size:14px}
</style>
</head>
<body>
<div class="box">
<h2>Reset Admin Password</h2>
<p>Enter your new password below.</p>
<input id="password" type="password" placeholder="New password" autocomplete="new-password">
<input id="confirm" type="password" placeholder="Confirm new password" autocomplete="new-password">
<button id="resetBtn">Update Password</button>
<p id="message"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
const db=window.bmtSupabase;
const message=document.getElementById("message");

async function checkSession(){
  if(!db){
    message.textContent="Supabase connection not found.";
    return;
  }
  const {data,error}=await db.auth.getSession();
  if(error || !data.session){
    message.textContent="Recovery session نہیں ملا۔ نئی Password Recovery Email منگوائیں۔";
  }else{
    message.textContent="Recovery link verified. Enter your new password.";
  }
}

document.getElementById("resetBtn").addEventListener("click",async()=>{
  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;

  if(password.length<8){
    message.textContent="Password کم از کم 8 حروف کا ہونا چاہیے۔";
    return;
  }
  if(password!==confirm){
    message.textContent="دونوں Password ایک جیسے نہیں ہیں۔";
    return;
  }
  const {data,error}=await db.auth.updateUser({password});
  if(error){
    message.textContent="Error: "+error.message;
    return;
  }
  message.textContent="Password successfully updated. اب Admin Login کریں۔";
});
checkSession();
</script>
</body>
</html>
