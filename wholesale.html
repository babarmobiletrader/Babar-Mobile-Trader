
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wholesale Registration | Babar Mobile Trader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f7fc;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 30px auto;
      padding: 30px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    .logo-title {
      text-align: center;
      color: #075bc5;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      color: #075bc5;
      font-size: 27px;
      margin: 15px 0;
    }

    .intro {
      text-align: center;
      color: #555;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 22px 0 9px;
      font-size: 17px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 100%;
      height: 54px;
      padding: 12px 15px;
      border: 1px solid #bbb;
      border-radius: 7px;
      font-size: 17px;
      background: white;
    }

    input:focus {
      outline: none;
      border: 2px solid #075bc5;
    }

    button {
      display: block;
      width: 100%;
      min-height: 55px;
      margin-top: 30px;
      background: #075bc5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #075bc5;
      font-size: 16px;
      text-decoration: none;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 15px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .container {
        margin: 12px auto;
        padding: 23px 17px;
      }

      .logo-title {
        font-size: 25px;
      }

      h1 {
        font-size: 24px;
      }

      input {
        height: 54px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div style="text-align:center; margin-bottom:15px;">
  <img src="bmt-logo.svg"
       alt="Babar Mobile Trader Logo"
       style="width:150px; height:auto; max-width:100%;">
</div>

    <h1>Wholesale Registration</h1>

    <p class="intro">
      Register with Babar Mobile Trader for wholesale
      mobile phone deals and business updates.
    </p>

    <form id="wholesaleForm">

      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" required>

      <label for="business">Business / Shop Name & Market</label>
      <input type="text" id="business" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" required>

      <label for="whatsapp">WhatsApp Number</label>
      <input type="tel" id="whatsapp" required>

      <label for="city">City</label>
      <input type="text" id="city" required>

      <button type="submit" id="submitBtn">
        Submit Registration
      </button>

      <p id="message"></p>

    </form>

    <a class="back" href="index.html">Back to Home</a>

  </div>

  <script>
  const form = document.getElementById("wholesaleForm");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    const fullName = document.getElementById("fullName").value.trim();
    const business = document.getElementById("business").value.trim();
    const email = document.getElementById("email").value.trim();
    const whatsapp = document.getElementById("whatsapp").value.trim();
    const city = document.getElementById("city").value.trim();

    const data = {
      _subject: "New Wholesale Registration - Babar Mobile Trader",
      _template: "table",
      "Full Name": fullName,
      "Business / Shop Name & Market": business,
      "Email Address": email,
      "WhatsApp Number": whatsapp,
      "City": city
    };

    button.disabled = true;
    button.textContent = "Submitting...";
    message.textContent = "Please wait, submitting your registration...";

    try {
      const response = await fetch(
        "https://formsubmit.co/ajax/info@babarmobiletrader.com",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(data)
        }
      );

      const responseText = await response.text();
      let result;

      try {
        result = JSON.parse(responseText);
      } catch {
        throw new Error("Invalid response from email service");
      }

      if (!response.ok || result.success !== true && result.success !== "true") {
        throw new Error(result.message || "Email submission failed");
      }

      message.textContent =
        "Registration submitted successfully! Opening WhatsApp...";

      const whatsappText =
        "Wholesale Registration - Babar Mobile Trader\n\n" +
        "Full Name: " + fullName + "\n" +
        "Business / Shop Name & Market: " + business + "\n" +
        "Email: " + email + "\n" +
        "WhatsApp: " + whatsapp + "\n" +
        "City: " + city;

      button.textContent = "Submitted Successfully";

      setTimeout(function() {
        window.location.href =
          "https://wa.me/923122741845?text=" +
          encodeURIComponent(whatsappText);
      }, 1500);

    } catch (error) {
      message.textContent = "Error: " + error.message;
      button.disabled = false;
      button.textContent = "Submit Registration";
    }
  });
</script>
</body>
</html>
